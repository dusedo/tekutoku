<!doctype html>
<!--
  行きたい店マップ ラッパー

  GASウェブアプリを直接開くとGoogleの警告バナーが強制表示されるため、
  iframeに入れて回避する(テクトクと同じ)。

  中身はiframeタグだけ。データはGAS側にあり公開範囲は「自分のみ」なので、
  このページのURLを知られても中身は読まれない。

  ★このアプリは現在地を使う(近い順に並べる)ので allow="geolocation" が要る。
    付けないとiframeの中で位置情報が取れず、評価順のままになる。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9">
<!--
  スタンドアロン起動用のメタタグ(apple-mobile-web-app-capable /
  mobile-web-app-capable)は入れないこと。
  入れるとホーム画面から別Cookie領域で起動し、iframe内のGoogle認証が
  通らず401になる。通常のブラウザ内で開かせてCookieを共有させる。
-->
<title>行きたい店マップ</title>
<style>
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#f6f7f9;}
  iframe{display:block; width:100%; height:100%; border:0;}
</style>
</head>
<body>
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbyR57qy0vu8VghIpphVucqc9hMz6uHnUfKDm1e8RCIA4_eMg_heMksq8scrs5BX2n7F4w/exec"
  title="行きたい店マップ"
  allow="geolocation"></iframe>
<script>
  // モバイルはアドレスバーの出入りで 100% が実際の表示高とズレるため、実測値を入れる(テクトクと同じ・2026-10-20)
  //   開いた後も何度か測り直し、タブ復帰・表示領域の変化・iframe読み込み完了でも合わせ直す
  function fit(){
    var h = (window.visualViewport && window.visualViewport.height * (window.visualViewport.scale || 1)) || window.innerHeight;
    h = Math.max(h, window.innerHeight, document.documentElement.clientHeight || 0);
    document.getElementById('app').style.height = Math.round(h) + 'px';
  }
  // ★2026-10-27 開いたらページ全体が拡大されたまま(右と上が見切れる)だった。Duo は開閉で画面幅が変わり、
  //   その時の拡大率が残る。開いた時・画面幅が変わった時に拡大されていたら等倍に戻す
  //   (viewport に一瞬 maximum-scale=1 を足すと Safari が拡大を解く。すぐ元に戻すのでピンチ拡大はそのまま使える)
  var lastW = window.innerWidth;
  function resetZoom(){
    var vv = window.visualViewport;
    if (!vv || vv.scale <= 1.01) return;
    var m = document.querySelector('meta[name=viewport]');
    var base = m.getAttribute('content');
    m.setAttribute('content', base + ', maximum-scale=1');
    setTimeout(function(){ m.setAttribute('content', base); fit(); }, 300);
  }
  function onResize(){
    if (window.innerWidth !== lastW) { lastW = window.innerWidth; resetZoom(); }
    fit();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ resetZoom(); fit(); }, 300); });
  window.addEventListener('pageshow', function(){ resetZoom(); fit(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { resetZoom(); fit(); setTimeout(fit, 400); } });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  document.getElementById('app').addEventListener('load', fit);
  resetZoom();
  fit();
  [250, 1000, 2500].forEach(function(ms){ setTimeout(fit, ms); });
</script>
</body>
</html>
