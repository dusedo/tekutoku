<!doctype html>
<!--
  テクトクライト集計 ラッパー

  GASウェブアプリを直接開くと、Googleが上部に
  「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」
  という帯を強制表示する。スクリプト側からは消せないため、
  iframeに入れて表示することでこの帯を回避する。

  中身はiframeタグだけ。データはGAS側にあり、GASの公開範囲は「自分のみ」なので、
  このページのURLを知られてもデータは読まれない。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="テクトク集計">
<title>テクトクライト集計</title>
<style>
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:#f4f5f7;}
  @media (prefers-color-scheme: dark){ html,body{background:#14171c;} }
  iframe{display:block; width:100%; height:100%; border:0;}
</style>
</head>
<body>
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzX-G3xBcUsFrnYtg488GSohKjDeS9JJyuBAC91CvHQS81nvsLxFGVnpi5TvamSqyxdRA/exec"
  title="テクトクライト集計"
  allow="clipboard-write"></iframe>
<script>
  // モバイルはアドレスバーの出入りで 100% が実際の表示高とズレるため、実測値を入れる
  function fit(){
    document.getElementById('app').style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
</script>
</body>
</html>
